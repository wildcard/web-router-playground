<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>web-router × AI SDK</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --border: #262626;
    --border-soft: #1a1a1a;
    --zinc: #a1a1aa;
    --zinc-dim: #71717a;
    --white: #fafafa;
    --accent: #22c55e;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--white);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 860px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }
  header {
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .brand .sep { color: var(--zinc-dim); font-size: 13px; }
  .brand .sdk { color: var(--zinc); font-size: 15px; }
  .tagline { color: var(--zinc-dim); font-size: 12px; margin-top: 4px; }
  select {
    background: var(--panel);
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
  }
  select:hover { border-color: var(--zinc-dim); }

  #providers {
    display: flex;
    gap: 8px;
    padding: 12px 0;
    flex-wrap: wrap;
  }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--zinc-dim);
  }
  .chip.on { color: var(--accent); border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.06); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg { display: flex; gap: 12px; }
  .msg .role {
    width: 64px; flex-shrink: 0;
    font-family: var(--mono); font-size: 11px; color: var(--zinc-dim);
    padding-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .msg .body { flex: 1; min-width: 0; line-height: 1.55; font-size: 14.5px; }
  .msg.user .body { color: var(--white); }
  .msg.assistant .body { color: var(--white); }

  .tool-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    padding: 10px 12px;
    margin: 6px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .tool-card .line1 {
    display: flex; align-items: center; gap: 8px;
    color: var(--zinc);
  }
  .tool-card .tname { color: var(--white); font-weight: 600; }
  .tool-card .spinner {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--zinc-dim);
    animation: pulse 1s ease-in-out infinite;
  }
  .tool-card.done .spinner { background: var(--accent); animation: none; }
  .tool-card .args { color: var(--zinc-dim); margin-top: 6px; word-break: break-all; }
  .tool-card .served {
    margin-top: 6px; color: var(--accent);
  }
  .tool-card .served b { color: var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  #composer {
    border-top: 1px solid var(--border-soft);
    padding: 16px 0 24px;
  }
  #composer form {
    display: flex; gap: 10px;
  }
  #composer input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--white);
    padding: 12px 14px;
    font-size: 14px;
    outline: none;
  }
  #composer input:focus { border-color: var(--zinc-dim); }
  #composer button {
    background: var(--white);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #composer button:disabled { opacity: 0.4; cursor: default; }
  #composer .hint { color: var(--zinc-dim); font-size: 11px; margin-top: 8px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">
        <span class="name">web-router</span>
        <span class="sep">×</span>
        <span class="sdk">Vercel AI SDK (Python)</span>
      </div>
      <div class="tagline">one integration, every search &amp; extract provider</div>
    </div>
    <select id="provider">
      <option value="auto">auto</option>
      <option value="nimble">nimble</option>
      <option value="tavily">tavily</option>
      <option value="exa">exa</option>
    </select>
  </header>

  <div id="providers"></div>

  <div id="log"></div>

  <div id="composer">
    <form id="form">
      <input id="input" type="text" autocomplete="off"
        placeholder="Search for something, extract a URL, or ask a question that needs both..." />
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Tool calls stream live below each answer — provider badges show which backend actually served the request.</div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const providerSel = document.getElementById('provider');
const providersEl = document.getElementById('providers');

async function loadProviders() {
  const res = await fetch('/api/providers');
  const data = await res.json();
  providersEl.innerHTML = '';
  for (const [name, ok] of Object.entries(data.search_extract)) {
    const chip = document.createElement('span');
    chip.className = 'chip' + (ok ? ' on' : '');
    chip.textContent = name;
    providersEl.appendChild(chip);
  }
  const chip = document.createElement('span');
  chip.className = 'chip' + (data.openai ? ' on' : '');
  chip.textContent = 'openai (agent model)';
  providersEl.appendChild(chip);
}
loadProviders();

function addMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  msg.innerHTML = `<div class="role">${role}</div><div class="body"></div>`;
  log.appendChild(msg);
  const body = msg.querySelector('.body');
  if (text) body.textContent = text;
  log.scrollTop = log.scrollHeight;
  return body;
}

function addToolCard(name) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="line1"><span class="spinner"></span> <span class="tname">${name}</span></div>
    <div class="args"></div>
    <div class="served"></div>
  `;
  return card;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  sendBtn.disabled = true;

  addMessage('user', message);
  const assistantBody = addMessage('assistant', '');
  let textBuf = '';
  const toolCards = {};

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, provider: providerSel.value }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const chunks = buf.split('\n\n');
    buf = chunks.pop();
    for (const chunk of chunks) {
      const lines = chunk.split('\n');
      let event = 'message', data = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7);
        if (line.startsWith('data: ')) data = line.slice(6);
      }
      if (!data) continue;
      const payload = JSON.parse(data);

      if (event === 'tool_start') {
        const card = addToolCard(payload.name);
        toolCards[payload.call_id] = card;
        assistantBody.appendChild(card);
        log.scrollTop = log.scrollHeight;
      } else if (event === 'tool_args') {
        const card = toolCards[payload.call_id];
        if (card) card.querySelector('.args').textContent = payload.args;
      } else if (event === 'tool_result') {
        const card = toolCards[payload.call_id];
        if (card) {
          card.classList.add('done');
          const provider = (payload.result && payload.result.provider) || '?';
          card.querySelector('.served').innerHTML = `served by <b>${provider}</b>`;
        }
      } else if (event === 'text_delta') {
        if (!textBuf) {
          const p = document.createElement('div');
          p.style.marginTop = '10px';
          assistantBody.appendChild(p);
          assistantBody._textEl = p;
        }
        textBuf += payload.chunk;
        assistantBody._textEl.textContent = textBuf;
        log.scrollTop = log.scrollHeight;
      } else if (event === 'error') {
        const p = document.createElement('div');
        p.style.color = '#f87171';
        p.textContent = 'Error: ' + payload.message;
        assistantBody.appendChild(p);
      }
    }
  }
  sendBtn.disabled = false;
  input.focus();
});
</script>
</body>
</html>
