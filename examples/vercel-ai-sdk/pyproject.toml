[project]
name = "web-router-aisdk-demo"
version = "0.1.0"
description = "WebRouter search+extract playground hosted on Vercel AI SDK for Python (preview)"
requires-python = ">=3.12"
dependencies = [
    "ai[openai]>=0.6.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.53.0",
    "web-router[all]",
]

[tool.uv.sources]
web-router = { path = "vendor/web_router-0.0.1-py3-none-any.whl" }

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
